# OONI 觀測涵蓋率（/projects/asn-coverage/）。資料在建置時從 OONI 的彙總 API 與 APNIC 的
# ASN 使用者估計讀，圖表畫成靜態 SVG，頁面不需要 JavaScript。細節見 asn_coverage.py。
#
# 第一個地區是主頁 /projects/asn-coverage/，其他地區各一頁 /projects/asn-coverage/<code>/。
# 代碼是 ISO 3166-1 的兩碼，OONI 與 APNIC 都用同一套。依地理分組排列，東亞、東南亞、南亞。

days = 60
# 卡片與表格看最近幾天，跟再往前的同樣天數比
compare_days = 30

