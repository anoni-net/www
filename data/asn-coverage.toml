stats_note = { zh-TW = "卡片是最近 {back} 天的數字，小圖是近 {days} 天每天的走勢。一筆測量是 OONI Probe 測試一個網站或一項服務的結果，執行一次網站測試就會產生上百筆。涵蓋的使用者是有測量的網路合計占這個地區多少網路使用者。前兩大網路的占比越低，代表測量越分散。pp 是百分點，兩個百分比之間的差。", zh-CN = "卡片是最近 {back} 天的数字，小图是近 {days} 天每天的走势。一笔测量是 OONI Probe 测试一个网站或一项服务的结果，运行一次网站测试就会产生上百笔。覆盖的用户是有测量的网络合计占这个地区多少网络用户。前两大网络的占比越低，代表测量越分散。pp 是百分点，两个百分比之间的差。", en = "Cards show the last {back} days, and the small charts show each day over the last {days}. One measurement is OONI Probe's result for one website or service, so a single run of the website test produces hundreds. Users covered is the share of the region's internet users on networks with measurements. A lower share for the top two networks means the measurements are more spread out. pp means percentage points, the difference between two percentages." }
daily = { zh-TW = "每天的測量", zh-CN = "每天的测量", en = "Daily measurements" }
daily_note = { zh-TW = "OONI Probe 每天在這個地區送出的測量，依結果分成四種。正常是結果跟對照一致。異常是結果跟對照不一致，可能是封鎖，也可能是網路不穩或網站本身的問題。確認封鎖是異常裡符合已知封鎖特徵的，例如被導向封鎖頁面。測量失敗是測試沒有完成，例如測到一半斷線。", zh-CN = "OONI Probe 每天在这个地区送出的测量，依结果分成四种。正常是结果跟对照一致。异常是结果跟对照不一致，可能是封锁，也可能是网络不稳或网站本身的问题。确认封锁是异常里符合已知封锁特征的，例如被导向封锁页面。测量失败是测试没有完成，例如测到一半断线。", en = "Measurements OONI Probe sends from this region each day, split by result. OK means the result matched the control. An anomaly means it did not, which can be blocking but also an unstable connection or a problem with the site itself. Confirmed blocking is an anomaly that matches a known blocking pattern, such as a redirect to a block page. Failure means the test did not complete, for example because the connection dropped midway." }
