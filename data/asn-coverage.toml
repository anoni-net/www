coverage_note = { zh-TW = "每天有測量的網路，依 APNIC 的估計合計占這個地區多少網路使用者。一個網路當天只要有一筆測量就算在內，所以這是涵蓋範圍的上限，不代表每個網路都測得夠多。", zh-CN = "每天有测量的网络，依 APNIC 的估计合计占这个地区多少网络用户。一个网络当天只要有一笔测量就算在内，所以这是覆盖范围的上限，不代表每个网络都测得够多。", en = "The share of this region's internet users, by APNIC's estimates, on networks that had at least one measurement that day. One measurement is enough to count, so this is an upper bound rather than a sign that every network is measured enough." }
chart_coverage = { zh-TW = "涵蓋的使用者（%）", zh-CN = "覆盖的用户（%）", en = "Users covered (%)" }
