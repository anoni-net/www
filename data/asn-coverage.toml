networks_note = { zh-TW = "APNIC（負責亞太地區 IP 位址與 ASN 分配的機構）估計使用者最多的十個網路。使用者欄是該網路占當地網路使用者的比例，測量欄是最近 {back} 天占當地所有測量的比例，天數是最近 {back} 天裡有測量的天數。網路名稱照錄登記資料，例如 HINET 是中華電信的固網、EMOME-NET 是中華電信的行動網路。使用者多、測量少的網路，最需要有人執行 OONI Probe。", zh-CN = "APNIC（负责亚太地区 IP 地址与 ASN 分配的机构）估计用户最多的十个网络。用户栏是该网络占当地网络用户的比例，测量栏是最近 {back} 天占当地所有测量的比例，天数是最近 {back} 天里有测量的天数。网络名称照录登记资料，例如 HINET 是中华电信的固网、EMOME-NET 是中华电信的移动网络。用户多、测量少的网络，最需要有人运行 OONI Probe。", en = "The ten networks with the most users by the estimates of APNIC, the registry that allocates IP addresses and ASNs in the Asia Pacific. Users is the network's share of the region's internet users, Measured is its share of the region's measurements over the last {back} days, and Days is how many of those days it had any. Names are copied from registry records; in Taiwan, for example, HINET is Chunghwa Telecom's fixed network and EMOME-NET its mobile network. Networks with many users and few measurements are where running OONI Probe helps most." }
