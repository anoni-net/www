stable_note = { zh-TW = "涵蓋率只要一個網路有一筆測量就算在內，只測過一兩天的網路也一樣。穩定涵蓋率只算最近 {back} 天裡至少 {n} 天有測量的網路，兩個數字差越多，代表越多使用者在只有零星測量的網路上。", zh-CN = "覆盖率只要一个网络有一笔测量就算在内，只测过一两天的网络也一样。稳定覆盖率只算最近 {back} 天里至少 {n} 天有测量的网络，两个数字差越多，代表越多用户在只有零星测量的网络上。", en = "Coverage counts a network as soon as it has a single measurement, even if it was measured on only a day or two. Steady coverage counts only networks measured on at least {n} of the last {back} days. The wider the gap between the two, the more users sit on networks with only scattered measurements." }
