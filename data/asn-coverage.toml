# OONI 觀測涵蓋率（/projects/asn-coverage/）。資料在建置時從 OONI 的彙總 API 與 APNIC 的
# ASN 使用者估計讀，圖表畫成靜態 SVG，頁面不需要 JavaScript。細節見 asn_coverage.py。
#
# 第一個地區是主頁 /projects/asn-coverage/，其他地區各一頁 /projects/asn-coverage/<code>/。
# 代碼是 ISO 3166-1 的兩碼，OONI 與 APNIC 都用同一套。依地理分組排列，東亞、東南亞、南亞。

days = 60
# 卡片與表格看最近幾天，跟再往前的同樣天數比
compare_days = 30

[[countries]]
code = "tw"
name = { zh-TW = "臺灣", zh-CN = "台湾", en = "Taiwan" }

[[countries]]
code = "hk"
name = { zh-TW = "香港", zh-CN = "香港", en = "Hong Kong" }

[[countries]]
code = "mo"
name = { zh-TW = "澳門", zh-CN = "澳门", en = "Macau" }

[[countries]]
code = "jp"
name = { zh-TW = "日本", zh-CN = "日本", en = "Japan" }

[[countries]]
code = "kr"
name = { zh-TW = "南韓", zh-CN = "韩国", en = "South Korea" }

[[countries]]
code = "sg"
name = { zh-TW = "新加坡", zh-CN = "新加坡", en = "Singapore" }

[[countries]]
code = "vn"
name = { zh-TW = "越南", zh-CN = "越南", en = "Vietnam" }

[[countries]]
code = "th"
name = { zh-TW = "泰國", zh-CN = "泰国", en = "Thailand" }

[[countries]]
code = "my"
name = { zh-TW = "馬來西亞", zh-CN = "马来西亚", en = "Malaysia" }

[[countries]]
code = "id"
name = { zh-TW = "印尼", zh-CN = "印度尼西亚", en = "Indonesia" }

[[countries]]
code = "ph"
name = { zh-TW = "菲律賓", zh-CN = "菲律宾", en = "Philippines" }
# 標題用的寫法，英文要加冠詞
title_name = { en = "the Philippines" }

[[countries]]
code = "in"
name = { zh-TW = "印度", zh-CN = "印度", en = "India" }

# 通訊 App 的連線測試。一個 App 一次查完所有國家（OONI 彙總 API 的 axis_x=probe_cc），
# 所以比較表可以多放幾個沒有自己頁面的參照地區，那些地區的封鎖紀錄讓比較有對照。
# Messenger（facebook_messenger）的測試在沒有封鎖紀錄的地區也常有一成以上的異常，
# 2026-10 臺灣 10%、菲律賓 15%，放進來容易被讀成封鎖，所以不列。
[apps]

[[apps.tests]]
test = "signal"
name = "Signal"

[[apps.tests]]
test = "whatsapp"
name = "WhatsApp"

[[apps.tests]]
test = "telegram"
name = "Telegram"

[[apps.regions]]
code = "cn"
name = { zh-TW = "中國", zh-CN = "中国", en = "China" }

[[apps.regions]]
code = "mm"
name = { zh-TW = "緬甸", zh-CN = "缅甸", en = "Myanmar" }

[[apps.regions]]
code = "kh"
name = { zh-TW = "柬埔寨", zh-CN = "柬埔寨", en = "Cambodia" }

[[apps.regions]]
code = "pk"
name = { zh-TW = "巴基斯坦", zh-CN = "巴基斯坦", en = "Pakistan" }

[[apps.regions]]
code = "bd"
name = { zh-TW = "孟加拉", zh-CN = "孟加拉国", en = "Bangladesh" }

