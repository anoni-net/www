[[posts]]
date = 2026-08-20
[posts.zh-TW]
title = "匿名網路社群前往 Global Gathering 2026"
summary = "Team CommUNITY 主辦的 Global Gathering 2026 於 9 月 4 日到 6 日在葡萄牙 Estoril 舉行，匿名網路社群申請到一個攤位，排在 9 月 6 日當地時間 13:00 到 15:00，位置是 6 號攤位，攤位名稱為 anoni.net Hub: Sinophone Asia-Pacific Networked Freedom。這是社群第一次參加，主要希望認識開發匿名網路與規避審查工具的技術工作者，以及同在亞洲區域的夥伴，並參與區域之間的協作。攤位的主題是匿名支付，議程上沒有任何一場以金流隱私為題，現場收集實際的使用情境。另一組來自台灣的團隊 Cofacts 也在同一個時段設攤，位置是 Booth 10。本文列出議程上與社群工作重疊的九場討論、會前往交流的六個攤位與各自想問的問題、活動前兩天找到我們的五種方式，以及無法到場的人可以參與的方式。8 月 13 日北部行動網路降速的觀測紀錄會一併帶往現場，作為與其他地區對照的案例。"
url = "blog/2026/08/2026-anoni-net-global-gathering/"
[posts.zh-CN]
title = "匿名网络社区前往 Global Gathering 2026"
summary = "Team CommUNITY 主办的 Global Gathering 2026 于 9 月 4 日到 6 日在葡萄牙 Estoril 举行，匿名网络社区申请到一个展位，排在 9 月 6 日当地时间 13:00 到 15:00，位置是 6 号展位，展位名称为 anoni.net Hub: Sinophone Asia-Pacific Networked Freedom。这是社区第一次参加，主要希望认识开发匿名网络与规避审查工具的技术工作者，以及同在亚洲区域的伙伴，并参与区域之间的协作。展位的主题是匿名支付，议程上没有任何一场以资金流隐私为题，现场收集实际的使用情境。另一组来自台湾的团队 Cofacts 也在同一个时段设展位，位置是 Booth 10。本文列出议程上与社区工作重叠的九场讨论、会前往交流的六个展位与各自想问的问题、活动前两天找到我们的五种方式，以及无法到场的人可以参与的方式。8 月 13 日台湾北部移动网络降速的观测记录会一并带往现场，作为与其他地区对照的案例。"
url = "blog/2026/08/2026-anoni-net-global-gathering/"
[posts.en]
title = "The Anonymity Networks Community Is Going to Global Gathering 2026"
summary = "Global Gathering 2026 runs from 4 to 6 September in Estoril, Portugal, hosted by Team CommUNITY. We have a booth on 6 September, 13:00 to 15:00 WEST, at Booth 6, titled anoni.net Hub: Sinophone Asia-Pacific Networked Freedom. This is our first Global Gathering. We want to meet technologists building anonymity networks and circumvention tools, and others working across Asia. The booth takes anonymous payment as its topic, a subject no session on the agenda covers, and collects real situations from the people who have run into it. Cofacts, another team from Taiwan, has Booth 10 in the same slot. This post covers the sessions on the agenda that overlap with our work, the booths we plan to visit and what we want to ask each of them, how to find us before our own slot, and how to take part without travelling. We also bring the observation record from 30 minutes of mobile throttling in northern Taiwan on 13 August, as a case others can compare against."
url = "blog/2026/08/2026-anoni-net-global-gathering/"

