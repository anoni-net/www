[posts.en]
title = "anoni.net/news and Same Day, Years Apart"
summary = "Most news on privacy, anonymity networks and internet censorship is published in English from a European or North American vantage point, and coverage tends to stop at the start of a story. anoni.net now runs a daily news site, anoni.net/news, that reads these stories from a technology and open-source angle, adds comparisons across Asia, explains the first step readers can take and what it costs, and follows stories as they develop. This post covers why we started it, how stories are chosen and checked, the eight categories, and the companion series Same Day, Years Apart."
url = "blog/2026/10/2026-anoni-net-news-launch/"

[[posts]]
date = 2026-09-02
[posts.zh-TW]
title = "一份英文密語詞表裡的 292 個亞洲外來語，是怎麼選出來的"
summary = "匿名網路社群做了一份 7776 字的英文密語詞表 asian-diceware，可以直接替換 EFF Large Wordlist，裡面固定收 292 個已經進入英文字典的亞洲外來語。這篇寫選字的過程：292 個字的來源分布跟做的人原本預期的不一樣，日語 102 個、南亞與梵語 91 個，華語只有 16 個，閩南語只有 ketchup 一個。也寫選字的兩個限制、為什麼停在 292 而不湊到整數比例，以及建置流程怎麼擋掉會讓詞表出問題的字。程式採 MIT、詞表採 CC-BY-4.0，附 A5 小冊 PDF，活動現場也會發實體本。"
url = "blog/2026/09/asian-diceware/"
[posts.zh-CN]
title = "一份英文密语词表里的 292 个亚洲外来语，是怎么选出来的"
summary = "匿名网络社区做了一份 7776 字的英文密语词表 asian-diceware，可以直接替换 EFF Large Wordlist，里面固定收 292 个已经进入英文字典的亚洲外来语。这篇写选字的过程：292 个字的来源分布跟做的人原本预期的不一样，日语 102 个、南亚与梵语 91 个，华语只有 16 个，闽南语只有 ketchup 一个。也写选字的两个限制、为什么停在 292 而不凑成整数比例，以及构建流程怎么挡掉会让词表出问题的字。程序采 MIT、词表采 CC-BY-4.0，附 A5 小册 PDF，活动现场也会发实体本。"
url = "blog/2026/09/asian-diceware/"
[posts.en]
title = "How 292 Asian loanwords ended up in an English passphrase wordlist"
summary = "The community built asian-diceware, a 7,776-word English passphrase wordlist that drops in for the EFF Large Wordlist and pins 292 dictionary-attested Asian loanwords. This post is about how the words were picked. The breakdown by source language is not what the people who built it expected: 102 from Japanese and 91 from South Asian languages, against 16 from Mandarin and exactly one from Hokkien. It also covers the two hard limits on word choice, why the share stops at 292 instead of rounding up to a tidy percentage, and how the build pipeline refuses to silently drop a pinned word. Code is MIT, the wordlist is CC-BY-4.0, and there is an A5 booklet PDF we also hand out at events."
url = "blog/2026/09/asian-diceware/"

[[posts]]
date = 2026-05-25
[posts.zh-TW]
title = "CryptPad 2026.5.0 上線：正體中文（zh_Hant）正式收進內建語系"
summary = "CryptPad 是少數讓伺服器看不到內容的線上協作工具，介面過去缺少正體中文。anoni.net 社群花兩年半在 CryptPad 上游做翻譯，2026/05 隨 CryptPad 2026.5.0 收進內建語系。現在打開 cryptpad.anoni.net，從 Drive 到分享權限對話框介面都是正體中文，台灣、香港、澳門的使用者可以直接上手。"
url = "blog/2026/05/2026-cryptpad-zh-hant/"
[posts.zh-CN]
title = "CryptPad 2026.5.0 上线：正体中文（zh_Hant）正式收进内建语系"
summary = "CryptPad 是少数让服务器看不到内容的在线协作工具。2026/05 随 CryptPad 2026.5.0 上线，正体中文（zh_Hant）正式收进内建语系，简体中文（zh_Hans）一并升级，并加入 locale alias 让旧设定（zh_CN、zh_TW）平滑迁移。社区自架的 cryptpad.anoni.net 已同步升级，对中国大陆使用者，搭配 Tor 或 VPN 即可访问。"
url = "blog/2026/05/2026-cryptpad-zh-hant/"
[posts.en]
title = "CryptPad 2026.5.0: zh_Hant Lands as a Built-in Locale After Two and a Half Years Upstream"
summary = "Two and a half years of upstream community work landed in CryptPad 2026.5.0 (2026/05/13): zh_Hant (Traditional Chinese) is now a built-in locale, zh_Hans was upgraded alongside it, and a new locale alias system migrates older zh_CN / zh_TW settings without surprise. The community-hosted cryptpad.anoni.net is upgraded; readers in Taiwan, Hong Kong, Macau, and across the diaspora can now use one of the few end-to-end encrypted collaboration suites entirely in their own script."
url = "blog/2026/05/2026-cryptpad-zh-hant/"

