[posts.zh-TW]
title = "新聞導讀 anoni.net/news 與導讀歷史"
summary = "國際上隱私、匿名網路與網路審查的新聞多半以英文發表，報導也常停在事情的開頭。anoni.net 社群開了新的網站新聞導讀 anoni.net/news，每天從科技與開源的角度整理這些新聞，寫出背後的技術、讀者現在能做的第一步與要付出的成本，並持續追蹤後續。文中說明為什麼做、選題與查核的原則、八個分類，以及每日專欄導讀歷史。"
url = "blog/2026/10/2026-anoni-net-news-launch/"
[posts.zh-CN]
title = "新闻导读 anoni.net/news 与导读历史"
summary = "国际上隐私、匿名网络与网络审查的新闻多半以英文发表，报道也常停在事情的开头。anoni.net 社区开了新的网站新闻导读 anoni.net/news，每天从科技与开源的角度整理这些新闻，写出背后的技术、读者现在能做的第一步与要付出的成本，并持续跟进后续。文中说明为什么做、选题与核查的原则、八个分类，以及每日专栏导读历史。"
