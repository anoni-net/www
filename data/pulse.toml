# 使用與貢獻：Tor Metrics 的使用者估計（tor_users.py）與中繼占全網路的權重
use = { zh-TW = "使用與貢獻", zh-CN = "使用与贡献", en = "Use and contribution" }
use_note = { zh-TW = "Tor Metrics 依中繼收到的目錄請求，推算每天平均同時上線的 Tor 客戶端，算不出不重複的人數。橋接是沒有公開列在 Tor 目錄裡的入口，直接連線被封鎖時改用橋接，所以橋接的比例高，通常代表直接連上 Tor 受到阻擋。權重是 Tor 依頻寬量測給每個中繼的分數，客戶端依權重挑選中繼，一個地區的權重加總大致是 Tor 流量經過這個地區的比例。使用者占全球的比例跟權重放在一起，可以看出這個地區用掉的與提供的轉送能量差多少。", zh-CN = "Tor Metrics 依中继收到的目录请求，推算每天平均同时在线的 Tor 客户端，算不出不重复的人数。网桥是没有公开列在 Tor 目录里的入口，直接连接被封锁时改用网桥，所以网桥的比例高，通常代表直接连上 Tor 受到阻挡。权重是 Tor 依带宽测量给每个中继的分数，客户端依权重挑选中继，一个地区的权重加总大致是 Tor 流量经过这个地区的比例。用户占全球的比例跟权重放在一起，可以看出这个地区用掉的与提供的转发能力差多少。", en = "Tor Metrics estimates the average number of Tor clients online at the same time each day from the directory requests relays receive; it cannot count distinct people. Bridges are entry points that are not publicly listed in the Tor directory, used when connecting directly is blocked, so a high bridge share usually means direct connections to Tor are being blocked. Weight is the score Tor gives each relay from bandwidth measurements, and clients pick relays by weight, so a region's total weight roughly matches the share of Tor traffic passing through it. Setting the region's share of the world's users beside its weight shows the gap between the capacity it uses and the capacity it provides." }
