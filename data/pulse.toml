# Tor 中繼節點觀測（/projects/pulse/）。資料在建置時從 Pulse 的 /api/summary 讀，
# 圖表畫成靜態 SVG，頁面不需要 JavaScript。m6 的部署腳本每小時重建一次。
#
# 第一個國家是主頁 /projects/pulse/，其他國家各一頁 /projects/pulse/<code>/。
# 國家清單要跟 Pulse 的 routers/vega.py 的 Country 一致。

days = 60
# 大數字卡片跟幾天前比
compare_days = 30

[[countries]]
code = "tw"
name = { zh-TW = "臺灣", zh-CN = "台湾", en = "Taiwan" }

[[countries]]
code = "jp"
name = { zh-TW = "日本", zh-CN = "日本", en = "Japan" }

[[countries]]
code = "kr"
name = { zh-TW = "南韓", zh-CN = "韩国", en = "South Korea" }

[[countries]]
code = "hk"
name = { zh-TW = "香港", zh-CN = "香港", en = "Hong Kong" }

[[countries]]
code = "sg"
name = { zh-TW = "新加坡", zh-CN = "新加坡", en = "Singapore" }

[[countries]]
code = "vn"
name = { zh-TW = "越南", zh-CN = "越南", en = "Vietnam" }

[[countries]]
code = "in"
name = { zh-TW = "印度", zh-CN = "印度", en = "India" }

[[countries]]
code = "de"
name = { zh-TW = "德國", zh-CN = "德国", en = "Germany" }

[[countries]]
code = "nl"
name = { zh-TW = "荷蘭", zh-CN = "荷兰", en = "Netherlands" }
# 標題用的寫法，英文要加冠詞
title_name = { en = "the Netherlands" }

[[countries]]
code = "us"
name = { zh-TW = "美國", zh-CN = "美国", en = "United States" }
# 標題用的寫法，英文要加冠詞
title_name = { en = "the United States" }

