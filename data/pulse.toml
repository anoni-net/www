roles = { zh-TW = "中繼的角色", zh-CN = "中继的角色", en = "Relay roles" }
roles_note = { zh-TW = "Guard 是電路的第一個節點，Exit 負責連往目的地，Middle 在兩者之間。一個中繼可以同時擔任多種角色。", zh-CN = "Guard 是电路的第一个节点，Exit 负责连往目的地，Middle 在两者之间。一个中继可以同时担任多种角色。", en = "Guards are the first hop of a circuit, exits connect to the destination, and middles sit in between. A relay can hold more than one role." }
