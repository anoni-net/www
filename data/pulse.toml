cmp_note = { zh-TW = "各地區的中繼數見上方。權重是最近一次快照，使用者與橋接比例是 Tor Metrics 近 {back} 天的平均。權重從 2026 年 10 月開始收集。最後的參照地區沒有運作中的中繼，只列使用者與橋接比例。", zh-CN = "各地区的中继数见上方。权重是最近一次快照，用户与网桥比例是 Tor Metrics 近 {back} 天的平均。权重从 2026 年 10 月开始收集。最后的参照地区没有运作中的中继，只列用户与网桥比例。", en = "Relay counts are above. Weight comes from the latest snapshot; users and the bridge share are Tor Metrics averages over the last {back} days. Weight has been collected since October 2026. The reference region at the end has no running relays, so only users and the bridge share are listed." }
