stats_note = { zh-TW = "卡片是最近一次快照的數字，跟 {back} 天前比，小圖是近 {days} 天的走勢。自治網路（ASN）是電信商、大學或雲端業者這類各自管理的網路，中繼分散在越多 ASN 越好。出口節點替使用者連往一般網站，網站看到的是出口節點的 IP。", zh-CN = "卡片是最近一次快照的数字，跟 {back} 天前比，小图是近 {days} 天的走势。自治网络（ASN）是电信商、大学或云服务商这类各自管理的网络，中继分散在越多 ASN 越好。出口节点替用户连往一般网站，网站看到的是出口节点的 IP。", en = "Cards show the latest snapshot against {back} days ago, with the trend over the last {days} days. An autonomous system (ASN) is a network run by one organisation, such as a telecom, a university or a cloud provider, and the more ASNs relays spread across the better. Exit relays connect users to ordinary websites, which see the exit relay's IP address." }
