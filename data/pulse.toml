# 使用與貢獻：Tor Metrics 的使用者估計（tor_users.py）與中繼占全網路的權重
use = { zh-TW = "使用與貢獻", zh-CN = "使用与贡献", en = "Use and contribution" }
use_note = { zh-TW = "Tor Metrics 依中繼收到的目錄請求，推算每天平均同時上線的 Tor 客戶端，算不出不重複的人數。透過橋接連線的另外計算，橋接的比例高，通常代表直接連上 Tor 受到阻擋。使用者占全球的比例跟中繼占全網路的權重放在一起，可以看出這個地區用掉的與提供的轉送能量差多少。", zh-CN = "Tor Metrics 依中继收到的目录请求，推算每天平均同时在线的 Tor 客户端，算不出不重复的人数。通过网桥连接的另外计算，网桥的比例高，通常代表直接连上 Tor 受到阻挡。用户占全球的比例跟中继占全网络的权重放在一起，可以看出这个地区用掉的与提供的转发能力差多少。", en = "Tor Metrics estimates the average number of Tor clients online at the same time each day from the directory requests relays receive; it cannot count distinct people. Clients connecting through bridges are counted separately, and a high bridge share usually means connecting to Tor directly is being blocked. Setting the region's share of the world's users beside its relays' share of the network's weight shows the gap between the capacity it uses and the capacity it provides." }
users = { zh-TW = "同時上線的使用者", zh-CN = "同时在线的用户", en = "Concurrent users" }
bridge_share = { zh-TW = "透過橋接的比例", zh-CN = "通过网桥的比例", en = "Via bridges" }
user_share = { zh-TW = "使用者占全球", zh-CN = "用户占全球", en = "Share of world users" }
