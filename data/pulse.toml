[[countries]]
code = "in"
name = { zh-TW = "印度", zh-CN = "印度", en = "India" }

[[countries]]
code = "de"
name = { zh-TW = "德國", zh-CN = "德国", en = "Germany" }

[[countries]]
code = "nl"
name = { zh-TW = "荷蘭", zh-CN = "荷兰", en = "Netherlands" }
# 標題用的寫法，英文要加冠詞
title_name = { en = "the Netherlands" }

[[countries]]
code = "us"
name = { zh-TW = "美國", zh-CN = "美国", en = "United States" }
# 標題用的寫法，英文要加冠詞
title_name = { en = "the United States" }

# 只放在「各地區的使用與貢獻」比較表的參照地區，沒有自己的頁面，也不在 Pulse 的收集清單裡。
# 中國沒有運作中的中繼，只列 Tor Metrics 的使用者與橋接比例，當作直接連線受阻的對照。
[[use_refs]]
code = "cn"
name = { zh-TW = "中國", zh-CN = "中国", en = "China" }

