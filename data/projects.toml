# 專案：社群自己寫的內容或程式，由社群撰寫與維護，有自己的路線圖與貢獻者。
# 別人開發、社群架設的軟體是服務，寫在 services.toml。
#
# content 是兩個內容專案，用填色卡呈現。tools 是觀測與工具，用細線列呈現。
# 專案的詳細介紹寫在專案自己的關於頁，這裡只放一句話。
#
# tools 的 name 用讀者看得懂的名稱，跟頁面標題一致。code 是專案代號（repo、API、季報裡看得到的名字），
# 縮小放在名稱旁邊，讀者在其他地方看到代號時對得起來。

[[content]]
icon = "folder-open-outline"
product = "docs"
display = "anoni.net/docs"
about = "about/"
name = { zh-TW = "文件", zh-CN = "文档", en = "Docs" }
summary.zh-TW = "從概念、工具到各種處境的準備，整理匿名網路與隱私的知識，也追蹤台灣的網路觀測與相關法規。"
summary.zh-CN = "从概念、工具到各种处境的准备，整理匿名网络与隐私的知识，也追踪台湾的网络观测与相关法规。"
summary.en = "Guides to anonymity networks and privacy, from concepts and tools to preparing for specific situations, plus Taiwan's network measurements and regulations."

[[content]]
icon = "newspaper-variant-outline"
product = "news"
display = "anoni.net/news"
about = "about/"
name = { zh-TW = "新聞導讀", zh-CN = "新闻导读", en = "News" }
summary.zh-TW = "從科技與開源的角度，導讀國際隱私、匿名網路與網路審查的新聞，每篇附上原文與導讀觀點。"
summary.zh-CN = "从科技与开源的角度，导读国际隐私、匿名网络与网络审查的新闻，每篇附上原文与导读观点。"
summary.en = "News on privacy, anonymity networks and Internet censorship, read from a tech and open-source angle with a view from Asia. Every story links to its original sources."

[[tools]]
icon = "access-point-network"
name = { zh-TW = "AI 助理的 Tor 節點查詢", zh-CN = "AI 助手的 Tor 节点查询", en = "Tor relay lookup for AI assistants" }
code = "onionoo-mcp"
page = "projects/onionoo-mcp"
summary.zh-TW = "在雲端 AI 助理貼上一個網址，就能用中文盤點各地的 Tor 節點、頻寬與所在的電信網路。"
summary.zh-CN = "在云端 AI 助手贴上一个网址，就能用中文盘点各地的 Tor 节点、带宽与所在的电信网络。"
summary.en = "Paste one URL into a cloud AI assistant and ask how many relays a place runs, with what bandwidth and on which networks."

[[tools]]
icon = "chart-line"
name = { zh-TW = "Tor 中繼節點觀測", zh-CN = "Tor 中继节点观测", en = "Tor Relay Watch" }
code = "Pulse"
page = "projects/pulse"
summary.zh-TW = "每小時收集臺灣與鄰近地區共十五個地區的 Tor 中繼節點資料，提供公開的 API 與本站的觀測頁。"
summary.zh-CN = "每小时收集台湾与邻近地区共十五个地区的 Tor 中继节点数据，提供公开的 API 与本站的观测页。"
summary.en = "Collects Tor relay data for Taiwan and fourteen other regions every hour, and serves a public API and the relay watch page on this site."

[[tools]]
icon = "map-outline"
name = { zh-TW = "OONI 觀測涵蓋率", zh-CN = "OONI 观测覆盖率", en = "OONI Coverage" }
code = "ASN Coverage"
page = "projects/asn-coverage"
summary.zh-TW = "對照 OONI 的測量與各網路的使用者人數，找出臺灣與鄰近地區還沒有人測量的網路。"
summary.zh-CN = "对照 OONI 的测量与各网络的用户人数，找出台湾与邻近地区还没有人测量的网络。"
summary.en = "Sets OONI measurements against each network's user count to find the networks in Taiwan and nearby regions that nobody is measuring yet."

[[tools]]
icon = "calendar-text"
name = { zh-TW = "觀測季報", zh-CN = "观测季报", en = "Quarterly reports" }
page = "projects/reports"
summary.zh-TW = "每季整理一次 Tor 中繼節點觀測與 OONI 觀測涵蓋率的數字，比較季初與季末、本季與上一季，寫下社群的解讀。"
summary.zh-CN = "每季整理一次 Tor 中继节点观测与 OONI 观测覆盖率的数字，比较季初与季末、本季与上一季，写下社区的解读。"
summary.en = "A quarterly write-up of the Tor Relay Watch and OONI Coverage numbers, comparing the start and end of the quarter and the quarter before, with the community's reading of them."
