# 服務：其他開源專案開發的軟體，社群負責架設、更新與維運，給大家使用。
# 社群自己寫的內容與程式是專案，寫在 projects.toml。
#
# onion = true 的服務有 onion 版本，網址改寫寫在 site.toml 的 [targets.onion.rewrite]。
# 帳號、容量、有效期這類事實照文件站的「社群自架服務」頁，那邊改了這裡也要改。
# home = true 的服務會出現在首頁那一排連結。

[[services]]
icon = "forum-outline"
name = "Matrix"
host = "matrix.anoni.net"
onion = true
home = true
kind = { zh-TW = "即時討論", zh-CN = "即时讨论", en = "Chat" }
summary.zh-TW = "日常討論、主題的協作房間與活動協調。家伺服器是 im.anoni.net，網頁版用 Element，手機用 Element X。"
summary.zh-CN = "日常讨论、主题的协作房间与活动协调。主服务器是 im.anoni.net，网页版用 Element，手机用 Element X。"
summary.en = "Day-to-day discussion, per-topic rooms and event coordination. The homeserver is im.anoni.net. Use Element on the web or Element X on a phone."
account.zh-TW = "需要帳號，來信申請"
account.zh-CN = "需要账号，来信申请"
account.en = "Account on request by email"

[[services]]
icon = "lock-outline"
name = "CryptPad"
host = "cryptpad.anoni.net"
onion = false
home = true
kind = { zh-TW = "加密共筆", zh-CN = "加密协作文档", en = "Encrypted documents" }
summary.zh-TW = "共筆、活動共編與機敏內容的加密協作，內建正體中文與簡體中文介面。"
summary.zh-CN = "共笔、活动共编与敏感内容的加密协作，内置正体中文与简体中文界面。"
summary.en = "Collaborative writing and event planning for material that needs encryption, with Traditional and Simplified Chinese interfaces built in."
account.zh-TW = "需要帳號，來信申請，預設容量 50 MB"
account.zh-CN = "需要账号，来信申请，默认容量 50 MB"
account.en = "Account on request by email, 50 MB by default"

[[services]]
icon = "note-edit-outline"
name = "Etherpad"
host = "pad.anoni.net"
onion = true
home = true
kind = { zh-TW = "即時共筆", zh-CN = "即时共笔", en = "Shared notes" }
summary.zh-TW = "活動現場一起記錄、臨時的草稿。內容沒有加密，取得連結的人都能讀，不要放敏感資訊。"
summary.zh-CN = "活动现场一起记录、临时的草稿。内容没有加密，取得链接的人都能读，不要放敏感信息。"
summary.en = "Notes taken together during an event and quick throwaway drafts. Nothing is encrypted and anyone with the link can read it, so keep sensitive material out."
account.zh-TW = "免帳號"
account.zh-CN = "免账号"
account.en = "No account"

[[services]]
icon = "magnify"
name = "SearXNG"
host = "search.anoni.net"
onion = true
home = true
kind = { zh-TW = "隱私搜尋", zh-CN = "隐私搜索", en = "Private search" }
summary.zh-TW = "彙整多個搜尋引擎的結果，不留紀錄、沒有廣告與第三方 cookie，可以設成瀏覽器的預設搜尋引擎。"
summary.zh-CN = "汇总多个搜索引擎的结果，不留记录、没有广告与第三方 cookie，可以设成浏览器的默认搜索引擎。"
summary.en = "Results from several search engines with no logging, no ads and no third-party cookies. You can make it your browser's default."
account.zh-TW = "免帳號"
account.zh-CN = "免账号"
account.en = "No account"

[[services]]
icon = "send-outline"
name = "Send"
host = "send.anoni.net"
onion = false
home = false
kind = { zh-TW = "加密傳檔", zh-CN = "加密传文件", en = "Encrypted file transfer" }
summary.zh-TW = "檔案在瀏覽器加密後上傳，連結可設密碼、下載次數與期限。每次最多 2.5 GB，最長保存 7 天。"
summary.zh-CN = "文件在浏览器加密后上传，链接可设密码、下载次数与期限。每次最多 2.5 GB，最长保存 7 天。"
summary.en = "Files are encrypted in the browser before upload, and links can carry a password, a download limit and an expiry. Up to 2.5 GB, kept for at most 7 days."
account.zh-TW = "免帳號"
account.zh-CN = "免账号"
account.en = "No account"

[[services]]
icon = "form-select"
name = "Formbricks"
host = "form.anoni.net"
onion = true
home = false
kind = { zh-TW = "隱私表單", zh-CN = "隐私表单", en = "Forms" }
summary.zh-TW = "電子報訂閱、活動報名與意見回饋。自架的表單不會讓填表的人被第三方服務追蹤。"
summary.zh-CN = "电子报订阅、活动报名与意见反馈。自架的表单不会让填表的人被第三方服务追踪。"
summary.en = "Newsletter sign-ups, event registration and feedback. A self-hosted form keeps respondents out of a third-party provider's tracking."
account.zh-TW = "填表免帳號，建立表單要來信申請"
account.zh-CN = "填表免账号，建立表单要来信申请"
account.en = "No account to fill in, on request to create forms"
