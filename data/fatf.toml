# 組織圖（<!-- fatf-org -->）：FATF、9 個區域組織（FSRB）與台灣經由 APG 參與的位置。
# 區域組織的名單取自 FATF 彙整評分表的說明頁，APG 的成員取自 apgml.org 的成員頁（2026-11，42 個成員）。
