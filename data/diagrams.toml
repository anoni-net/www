# 關於頁的三張圖，由 diagrams.py 在建置時畫成內嵌的 SVG 與 HTML，頁面不需要 JavaScript。
# Markdown 裡寫 <!-- diagram-community -->、<!-- diagram-regions -->、<!-- diagram-history -->。
# 圖上的文字三個語系都在這裡，改內容不必動程式。

# 社群在做的事：中間是 anoni.net，往外四個方向。topic 對應 data/topics.toml 的 cat，
# 名稱、圖示與連結從那裡取。區域觀測不是年度主題，另外寫在這裡。
[community]
label = { zh-TW = "社群在做的事：三大主題與區域觀測", zh-CN = "社区在做的事：三大主题与区域观测", en = "What the community works on: three themes and regional observation" }
note = { zh-TW = "點圖上的項目開啟介紹頁。", zh-CN = "点图上的项目打开介绍页。", en = "Select an item to open its page." }

[[community.nodes]]
topic = "privacy"
items.zh-TW = ["文件站的隱私指南", "日常、敏感工作、高風險三級"]
items.zh-CN = ["文档站的隐私指南", "日常、敏感工作、高风险三级"]
items.en = ["Privacy guides on the docs site", "Everyday, sensitive, high-risk"]

[[community.nodes]]
topic = "relay"
items.zh-TW = ["台師大的節點運作中", "提案範本、SOP、FAQ 公開"]
items.zh-CN = ["台师大的节点运行中", "提案范本、SOP、FAQ 公开"]
items.en = ["NTNU's relay is running", "Proposal kit, SOP and FAQ"]

[[community.nodes]]
topic = "payments"
items.zh-TW = ["COSCUP 2026 議程合作", "Global Gathering 攤位主題"]
items.zh-CN = ["COSCUP 2026 议程合作", "Global Gathering 摊位主题"]
items.en = ["COSCUP 2026 sessions", "Global Gathering booth"]

[[community.nodes]]
cat = "observe"
icon = "chart-line"
page = "projects/reports"
name = { zh-TW = "區域觀測", zh-CN = "区域观测", en = "Regional observation" }
items.zh-TW = ["Tor 中繼節點觀測", "OONI 觀測涵蓋率、季報"]
items.zh-CN = ["Tor 中继节点观测", "OONI 观测覆盖率、季报"]
items.en = ["Tor Relay Watch", "OONI Coverage, reports"]

# 關注地區：臺灣是第一手經驗，其他五個地區透過公開資料與當地聯絡人追蹤
[regions]
first = ["tw"]
others = ["cn", "hk", "mo", "my", "sg"]
label = { zh-TW = "社群關注的華語六地區", zh-CN = "社区关注的华语六地区", en = "The six Chinese-speaking regions the community follows" }
legend_first = { zh-TW = "第一手經驗", zh-CN = "第一手经验", en = "First-hand experience" }
legend_others = { zh-TW = "透過公開資料與當地聯絡人追蹤", zh-CN = "通过公开资料与当地联络人追踪", en = "Followed through public data and local contacts" }
note = { zh-TW = "也關注在各地之間移動的華語離散社群（diaspora），沒有畫在地圖上。", zh-CN = "也关注在各地之间移动的华语离散社群（diaspora），没有画在地图上。", en = "We also follow the Chinese-speaking diaspora that moves between these places, which the map cannot show." }

[regions.names]
tw = { zh-TW = "臺灣", zh-CN = "台湾", en = "Taiwan" }
cn = { zh-TW = "中國大陸", zh-CN = "中国大陆", en = "Mainland China" }
hk = { zh-TW = "香港", zh-CN = "香港", en = "Hong Kong" }
mo = { zh-TW = "澳門", zh-CN = "澳门", en = "Macao" }
my = { zh-TW = "馬來西亞", zh-CN = "马来西亚", en = "Malaysia" }
sg = { zh-TW = "新加坡", zh-CN = "新加坡", en = "Singapore" }

# 社群的起點：時間由舊到新。連結是本站頁面（page）、社群動態（post，寫檔名，三個語系都要有）或文件站（docs）擇一。
# kind 決定圓點的顏色，跟社群動態的標籤同一套（new、event、update），origin 是起點。
[history]
label = { zh-TW = "社群的起點與重要紀錄", zh-CN = "社区的起点与重要记录", en = "How the community started, and what has happened since" }

