# anoni.net 首頁與社群頁面的設定。頁面寫在 pages/，介面文字寫在 strings.toml，
# 專案、服務、主題的資料寫在 data/。

onion_host = "anoninetru5tflukgfaehun7q6khowgmymcff3gtk5oyesqazhmfxtyd.onion"

# 正體中文是預設語系，掛在根目錄。順序同時是語言切換的順序。
[[languages]]
code = "zh-TW"
og = "zh_TW"
html = "zh-Hant-TW"
prefix = ""
label = "正體"

[[languages]]
code = "zh-CN"
og = "zh_CN"
html = "zh-Hans"
prefix = "/zh-cn"
label = "简体"

[[languages]]
code = "en"
og = "en_US"
html = "en"
prefix = "/en"
label = "EN"

# 頁首的導覽列。page 是本站的頁面，docs 是連到文件站的頁面（2026-10-09 起都是本站的頁面）。
# 搬過來之後把 docs 換成 page。
[[nav]]
key = "about"
page = "about"

[[nav]]
key = "join"
page = "join"

[[nav]]
key = "projects"
page = "projects"

[[nav]]
key = "services"
page = "services"

[[nav]]
key = "events"
page = "events"

[[nav]]
key = "updates"
page = "updates"

# 三個輸出目標。onion 版本在寫檔前把 clearnet 網址改寫成 onion，順序由長到短，
# 子網域與路徑要排在網域本身之前。沒有 onion 版本的服務（CryptPad、Send、onionoo）
# 不在這裡，onion 頁面上照樣連到 clearnet。
# clearnet = true 的目標有 canonical、Onion-Location 與結構化資料，analytics 載入流量統計。
[targets.clearnet]
base = "https://anoni.net"
clearnet = true
analytics = true
# extra/ 底下只有這個目標要的檔案，原樣輸出到根目錄
extra = ["llms.txt"]

[targets.onion]
base = "http://anoninetru5tflukgfaehun7q6khowgmymcff3gtk5oyesqazhmfxtyd.onion"
clearnet = false

[targets.onion.rewrite]
# assets.anoni.net 的圖片在 onion 那一側掛在根位址的 /assets/ 底下
"https://assets.anoni.net" = "http://{onion}/assets"
"https://anoni.net/docs" = "http://docs.{onion}"
"https://anoni.net/news" = "http://news.{onion}"
"https://anoni.net/mystery" = "http://mystery.{onion}"
# 檔案工作台（Gears）的 onion 版放在子網域的根目錄，anoni.net/gears/x 對應 gears.<onion>/x
"https://anoni.net/gears" = "http://gears.{onion}"
"https://matrix.anoni.net" = "http://matrix.{onion}"
"https://pad.anoni.net" = "http://pad.{onion}"
"https://search.anoni.net" = "http://search.{onion}"
"https://form.anoni.net" = "http://form.{onion}"
"https://anoni.net" = "http://{onion}"

# anoni.net 的 IPFS 鏡像（toomore/anoni-net-ws#422），整個網站掛在閘道的根目錄。
# 鏡像是備援，canonical、og、hreflang、結構化資料、sitemap 與 RSS 都指回 anoni.net，
# 只改寫 <body> 裡 href 與 src 的網址（links_only），內文寫出來的網址也不動。
[targets.ipfs]
base = "https://anoni.net"
clearnet = true
links_only = true
# 文件站、新聞導讀與 mystery 在組裝時放進同一個根目錄，建置檢查不找這些路徑的檔案
mounts = ["/docs/", "/news/", "/mystery/"]
# 連到這個前綴的圖片由部署腳本從圖片主機複製進來，清單寫在輸出目錄旁的 ipfs-assets.txt
assets = "/assets/"
# 不在鏡像裡的網站：Gears 的模型太大，API 是動態服務
keep = ["https://anoni.net/gears", "https://anoni.net/api"]

[targets.ipfs.rewrite]
"https://assets.anoni.net/" = "/assets/"
"https://anoni.net/" = "/"
