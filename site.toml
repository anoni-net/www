# anoni.net 首頁與社群頁面的設定。頁面寫在 pages/，介面文字寫在 strings.toml，
# 專案、服務、主題的資料寫在 data/。

onion_host = "anoninetru5tflukgfaehun7q6khowgmymcff3gtk5oyesqazhmfxtyd.onion"

# 正體中文是預設語系，掛在根目錄。順序同時是語言切換的順序。
[[languages]]
code = "zh-TW"
og = "zh_TW"
html = "zh-Hant-TW"
prefix = ""
label = "正體"

[[languages]]
code = "zh-CN"
og = "zh_CN"
html = "zh-Hans"
prefix = "/zh-cn"
label = "简体"

[[languages]]
code = "en"
og = "en_US"
html = "en"
prefix = "/en"
label = "EN"

# 頁首的導覽列。page 是本站的頁面，docs 是連到文件站的頁面（2026-10-09 起都是本站的頁面）。
# 搬過來之後把 docs 換成 page。
[[nav]]
key = "about"
page = "about"

[[nav]]
key = "join"
page = "join"

[[nav]]
key = "projects"
page = "projects"

[[nav]]
key = "services"
page = "services"

[[nav]]
key = "events"
page = "events"

[[nav]]
key = "updates"
page = "updates"

# 兩個輸出目標。onion 版本在寫檔前把 clearnet 網址改寫成 onion，順序由長到短，
# 子網域與路徑要排在網域本身之前。沒有 onion 版本的服務（CryptPad、Send、onionoo）
# 不在這裡，onion 頁面上照樣連到 clearnet。
[targets.clearnet]
base = "https://anoni.net"
clearnet = true
# extra/ 底下只有這個目標要的檔案，原樣輸出到根目錄
extra = ["llms.txt"]

[targets.onion]
base = "http://anoninetru5tflukgfaehun7q6khowgmymcff3gtk5oyesqazhmfxtyd.onion"
clearnet = false
# 沒有 onion 版、但網址在 anoni.net 底下的網站，下方的 rewrite 不改寫，onion 頁面照樣連到 clearnet。
# 檔案工作台（Gears）不支援 Tor Browser，還沒有 onion 版
keep = ["https://anoni.net/gears"]

[targets.onion.rewrite]
# assets.anoni.net 的圖片在 onion 那一側掛在根位址的 /assets/ 底下
"https://assets.anoni.net" = "http://{onion}/assets"
"https://anoni.net/docs" = "http://docs.{onion}"
"https://anoni.net/news" = "http://news.{onion}"
"https://anoni.net/mystery" = "http://mystery.{onion}"
"https://matrix.anoni.net" = "http://matrix.{onion}"
"https://pad.anoni.net" = "http://pad.{onion}"
"https://search.anoni.net" = "http://search.{onion}"
"https://form.anoni.net" = "http://form.{onion}"
"https://anoni.net" = "http://{onion}"
