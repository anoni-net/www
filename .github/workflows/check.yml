name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
      - run: uv sync
      # 只檢查頁面結構，不讀 Pulse、Tor Metrics、OONI 與 APNIC。外部的 API 一慢，
      # 每個請求都要等到逾時，檢查會從幾秒拖到十幾分鐘
      - run: uv run build.py --check
        env:
          WWW_OFFLINE: "1"
