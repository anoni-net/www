  [1, 67.0, 48.0],
  [2, 39.5, 8.5],
  [3, 69.5, 29.5],
  [4, 96.0, 21.0],
  [5, 85.5, 41.5],
  [6, 118.0, 26.0],
  [7, 119.6, 33.0],
]

[groups]
# 主色：客戶國家；另一種色調：中國（省級防火牆專案）
