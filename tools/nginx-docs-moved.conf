# 文件站搬到官網的頁面，clearnet 與 onion 兩邊的 301 對照表。
#
# 原始檔在 anoni-net/www 的 tools/nginx-docs-moved.conf，改了之後複製到 m6 的
# /etc/nginx/conf.d/anoni-docs-moved.conf，nginx -t 通過再 reload。conf.d 底下的檔案
# 由 nginx.conf 在 http 區塊引入，map 只能寫在那一層。
#
# anoninet.conf 的 anoni.net 與 docs.<onion> 兩個 server 開頭各有一行 if 讀這裡的變數：
#   if ($anoni_docs_moved)       { return 301 $anoni_docs_moved; }
#   if ($anoni_docs_moved_onion) { return 301 $anoni_docs_moved_onion; }
#
# 每一條比對三種寫法：不帶尾斜線、帶尾斜線、帶 index.html。query string 不帶過去。
# 新增一頁時三個語系都要想一次：英文版的 how-to-contribute 寫的是 GitHub 貢獻流程，
# 跟官網的 /join/ 不是同一份內容，所以沒有轉。

# clearnet：anoni.net/docs/...
map $uri $anoni_docs_moved {
    default "";

    ~^/docs/contact(/|/index\.html)?$                               https://anoni.net/contact/;
    ~^/docs/zh-cn/contact(/|/index\.html)?$                         https://anoni.net/zh-cn/contact/;
    ~^/docs/en/contact(/|/index\.html)?$                            https://anoni.net/en/contact/;

    ~^/docs/community/tools(/|/index\.html)?$                       https://anoni.net/services/;
    ~^/docs/zh-cn/community/tools(/|/index\.html)?$                 https://anoni.net/zh-cn/services/;
    ~^/docs/en/community/tools(/|/index\.html)?$                    https://anoni.net/en/services/;

    ~^/docs/community/how-to-contribute(/|/index\.html)?$           https://anoni.net/join/;
    ~^/docs/zh-cn/community/how-to-contribute(/|/index\.html)?$     https://anoni.net/zh-cn/join/;
}

# onion：docs.<onion>/...，網站在子網域的根目錄，路徑不帶 /docs
map $uri $anoni_docs_moved_onion {
    default "";

    ~^/contact(/|/index\.html)?$                                    http://anoninetru5tflukgfaehun7q6khowgmymcff3gtk5oyesqazhmfxtyd.onion/contact/;
    ~^/zh-cn/contact(/|/index\.html)?$                              http://anoninetru5tflukgfaehun7q6khowgmymcff3gtk5oyesqazhmfxtyd.onion/zh-cn/contact/;
    ~^/en/contact(/|/index\.html)?$                                 http://anoninetru5tflukgfaehun7q6khowgmymcff3gtk5oyesqazhmfxtyd.onion/en/contact/;

    ~^/community/tools(/|/index\.html)?$                            http://anoninetru5tflukgfaehun7q6khowgmymcff3gtk5oyesqazhmfxtyd.onion/services/;
    ~^/zh-cn/community/tools(/|/index\.html)?$                      http://anoninetru5tflukgfaehun7q6khowgmymcff3gtk5oyesqazhmfxtyd.onion/zh-cn/services/;
    ~^/en/community/tools(/|/index\.html)?$                         http://anoninetru5tflukgfaehun7q6khowgmymcff3gtk5oyesqazhmfxtyd.onion/en/services/;

    ~^/community/how-to-contribute(/|/index\.html)?$                http://anoninetru5tflukgfaehun7q6khowgmymcff3gtk5oyesqazhmfxtyd.onion/join/;
    ~^/zh-cn/community/how-to-contribute(/|/index\.html)?$          http://anoninetru5tflukgfaehun7q6khowgmymcff3gtk5oyesqazhmfxtyd.onion/zh-cn/join/;
}
